<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e40af" />
  <title>Sin conexión · Módulo Salud</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #1e293b;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.4rem; margin: 16px 0 8px; }
    p { color: #475569; line-height: 1.5; }
    button { margin-top: 16px; background: #1d4ed8; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icono-192.png" alt="" />
    <h1>Sin conexión a internet</h1>
    <p>El Módulo Salud necesita internet para mostrar datos actualizados de los pacientes. Revise la conexión e intente de nuevo.</p>
    <button onclick="location.reload()">Intentar de nuevo</button>
  </main>
</body>
</html>
