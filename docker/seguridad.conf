# Cabeceras de seguridad comunes (se incluyen en el server y en cada location que tenga
# sus propios add_header: en nginx, un add_header dentro de un location hace que ese location
# ya no herede los del server).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Solo HTTPS (el sitio se publica por el túnel de Cloudflare); sin includeSubDomains ni preload
add_header Strict-Transport-Security "max-age=31536000" always;
# La app no usa cámara, micrófono, ubicación ni pagos
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
