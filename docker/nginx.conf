# nginx del frontend (contenedor "frontend").
# Sirve la app compilada y hace de proxy de /api hacia el backend, así todo
# queda bajo el mismo dominio (https://saludumg.online) y no hace falta CORS.
# Límite de peticiones a la API por visitante. Detrás del túnel de Cloudflare todas las
# peticiones llegan desde la misma IP, así que se usa la IP real que manda Cloudflare
# (CF-Connecting-IP). El puerto solo escucha en 127.0.0.1, por eso solo el túnel llega aquí.
map $http_cf_connecting_ip $visitante {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# 10 peticiones por segundo sostenidas, con ráfagas de hasta 40 (al abrir el panel se
# piden varias cosas a la vez). Lo que pase de eso recibe 429 en JSON.
limit_req_zone $visitante zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cuerpos de más de 1 MB se rechazan (la API solo recibe formularios)
    client_max_body_size 1m;

    # API -> contenedor "backend" (gunicorn en el puerto 5050)
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        error_page 429 = @demasiadas;
        error_page 413 = @muy_grande;
        proxy_pass http://backend:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location @demasiadas {
        default_type application/json;
        add_header Retry-After 5 always;
        return 429 '{"success":false,"error":"demasiadas_peticiones","message":"Demasiadas peticiones seguidas. Espere unos segundos e intente de nuevo."}';
    }

    location @muy_grande {
        default_type application/json;
        return 413 '{"success":false,"error":"cuerpo_muy_grande","message":"Los datos enviados pasan de 1 MB."}';
    }

    # Swagger del backend (opcional, útil para la presentación)
    location /apidocs { proxy_pass http://backend:5050; }
    location /flasgger_static/ { proxy_pass http://backend:5050; }
    location /apispec_1.json { proxy_pass http://backend:5050; }

    # Configuración en tiempo de ejecución: nunca en caché, cambia con la URL del día
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # App instalable: el manifiesto con su tipo y el service worker siempre fresco
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # React Router: cualquier ruta (/pacientes, /citas...) devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
